id = "herdr-vibe"
name = "Herdr Vibe"
version = "1.0.0"
min_herdr_version = "0.7.0"
description = "Start Mistral Vibe sessions in Herdr panes"
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "start"
title = "Start Vibe"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "herdr-vibe", "--entrypoint", "vibe"]

[[panes]]
id = "vibe"
title = "Mistral Vibe"
placement = "split"
command = ["vibe"]
